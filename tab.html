  html += '<div style="margin-top:20px;">';
  html += '<button class="btn sm" onclick="openJsonEditor()">Open in JSON Editor</button>';
  html += '</div>';

  document.getElementById('panelMeta').innerHTML = html;
}

function renderActions(doc) {
  var isDraft = doc._id.startsWith('drafts.');
  var html = '';

  html += '<button class="btn primary sm" onclick="saveDocument()">Save</button>';
  if (isDraft) {
    html += '<button class="btn sm" onclick="publishDraft()">Publish</button>';
    html += '<button class="btn sm danger" onclick="discardDraft()">Discard Draft</button>';
  }
  html += '<button class="btn sm" onclick="askAiAboutDoc()">Ask AI</button>';
  html += '<button class="btn sm" onclick="openJsonEditor()">JSON</button>';
  if (state.health && state.health.studioUrl) {
    html += '<button class="btn sm" onclick="openStudio(\'' + esc(doc._id) + '\')">Studio</button>';
  }
  html += '<span class="spacer"></span>';
  html += '<button class="btn sm danger" onclick="deleteDocument()">Delete</button>';

  document.getElementById('detailActions').innerHTML = html;
}

// ============================================================================
// DOCUMENT ACTIONS
// ============================================================================
async function saveDocument() {
  var doc = state.selected;
  if (!doc) return;

  var sec = state.section;
  var docType = doc._type;
  var patchData = {};

  // Collect rich text editor values first
  for (var r = 0; r < activeRteInstances.length; r++) {
    var rte = activeRteInstances[r];
    if (!rte.fieldKey) continue;
    var origVal = doc[rte.fieldKey];
    if (typeof origVal === 'string') {
      // HTML string field -- save the HTML directly
      patchData[rte.fieldKey] = rte.getHtml();
    }
    // For Portable Text we don't convert back -- that requires a full HTML-to-PT converter.
    // Users must use the JSON editor for structural PT changes.
  }

  // Collect form field values -- only for fields that have editable inputs
  var fields = Object.keys(doc).filter(function(k) { return !k.startsWith('_'); });
  for (var i = 0; i < fields.length; i++) {
    var k = fields[i];
    var el = document.getElementById('field_' + k);
    if (!el) continue; // Skip fields without form inputs (components, portable text, etc.)

    var origVal = doc[k];

    if (el.dataset.slug === 'true') {
      patchData[k] = { _type: 'slug', current: el.value };
    } else if (el.dataset.csv === 'true') {
      patchData[k] = el.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
    } else if (el.dataset.json === 'true') {
      try { patchData[k] = JSON.parse(el.value); }
      catch (e) { showToast('Invalid JSON in field "' + k + '"', 'err'); return; }
    } else if (el.tagName === 'SELECT' && (origVal === true || origVal === false)) {
      patchData[k] = el.value === 'true';
    } else if (typeof origVal === 'number') {
      patchData[k] = Number(el.value);
    } else {
      patchData[k] = el.value;
    }
  }

  var r = await api('PATCH', '/documents/' + docType + '/' + doc._id, patchData);
  if (r.error) {
    showToast('Save failed: ' + r.error, 'err');
    return;
  }

  showToast('Saved', 'ok');

  // Reload
  await loadSection();
}

async function publishDraft() {
  var doc = state.selected;
  if (!doc || !doc._id.startsWith('drafts.')) return;

  var ok = await askConfirm({ title: 'Publish Draft', message: 'This will publish the draft and make it live. Continue?', confirmText: 'Publish' });
  if (!ok) return;

  var r = await api('POST', '/drafts/' + encodeURIComponent(doc._id) + '/publish');
  if (r.error) { showToast('Publish failed: ' + r.error, 'err'); return; }

  showToast('Published', 'ok');
  closeDetail();
  await loadHealth();
  renderSidebar();
  await loadSection();
}

async function discardDraft() {
  var doc = state.selected;
  if (!doc || !doc._id.startsWith('drafts.')) return;

  var ok = await askConfirm({ title: 'Discard Draft', message: 'This will permanently delete this draft. Continue?', confirmText: 'Discard', danger: true });
  if (!ok) return;

  var r = await api('POST', '/drafts/' + encodeURIComponent(doc._id) + '/discard');
  if (r.error) { showToast('Discard failed: ' + r.error, 'err'); return; }

  showToast('Draft discarded', 'ok');
  closeDetail();
  await loadHealth();
  renderSidebar();
  await loadSection();
}

async function deleteDocument() {
  var doc = state.selected;
  if (!doc) return;

  var ok = await askConfirm({ title: 'Delete Document', message: 'This will permanently delete "' + (doc.title || doc.name || doc._id) + '". This cannot be undone.', confirmText: 'Delete', danger: true });
  if (!ok) return;

  var r = await api('DELETE', '/documents/' + doc._type + '/' + doc._id);
  if (r.error) { showToast('Delete failed: ' + r.error, 'err'); return; }

  showToast('Deleted', 'ok');
  closeDetail();
  await loadHealth();
  renderSidebar();
  await loadSection();
}

function askAiAboutDoc() {
  var doc = state.selected;
  if (!doc) return;
  var title = doc.title || doc.name || doc.heading || doc._id;
  Symphonee.askAi('Fetch this Sanity document:\ncurl -s http://127.0.0.1:3800/api/plugins/sanity/documents/' + doc._type + '/' + doc._id + '\n\nThis is "' + title + '" (type: ' + doc._type + '). Show me a readable summary and ask what I want to do -- edit fields, duplicate, translate, or analyze content quality.');
}

// ============================================================================
// ASSET DETAIL
// ============================================================================
async function openAsset(id) {
  // Reset detail body styles
  var detailBody = document.getElementById('detailBody');
  detailBody.style.display = '';
  detailBody.style.flexDirection = '';
  detailBody.style.padding = '';
  var panelContent = document.getElementById('panelContent');
  panelContent.style.display = '';
  panelContent.style.flexDirection = '';
  panelContent.style.flex = '';

  var asset = state.items.find(function(a) { return a._id === id; });
  if (!asset) return;

  state.selected = asset;
  openDetail();

  // Highlight
  document.querySelectorAll('.media-card, .row').forEach(function(el) { el.classList.remove('selected'); });
  document.querySelectorAll('.media-card').forEach(function(el) {
    if (el.dataset.id === id) el.classList.add('selected');
  });

  var name = asset.originalFilename || asset._id;
  document.getElementById('detailTitle').textContent = name;
  document.getElementById('detailSubtitle').textContent = (asset.mimeType || '') + (asset.size ? ' - ' + formatBytes(asset.size) : '');

  // Tabs: Details + Usage
  document.getElementById('detailTabs').innerHTML =
    '<div class="tab active" data-tab="content" onclick="switchTab(\'content\')">Details</div>'
    + '<div class="tab" data-tab="references" onclick="switchTab(\'references\')">Usage</div>'
    + '<div class="tab" data-tab="meta" onclick="switchTab(\'meta\')">Meta</div>';

  // Details panel
  var html = '';
  if (asset._type === 'sanity.imageAsset' && asset.url) {
    html += '<div style="margin-bottom:14px;border-radius:var(--radius);overflow:hidden;background:var(--surface0);">';
    html += '<img src="' + esc(asset.url) + '?w=600&h=400&fit=max" style="width:100%;display:block;">';
    html += '</div>';
  }
  html += '<div class="field"><label class="field-label">Filename</label><div class="field-readonly">' + esc(name) + '</div></div>';
  if (asset.url) html += '<div class="field"><label class="field-label">URL</label><div class="field-readonly" style="font-size:10px;word-break:break-all;">' + esc(asset.url) + '</div></div>';
  if (asset.mimeType) html += '<div class="field"><label class="field-label">MIME Type</label><div class="field-readonly">' + esc(asset.mimeType) + '</div></div>';
  if (asset.size) html += '<div class="field"><label class="field-label">Size</label><div class="field-readonly">' + formatBytes(asset.size) + '</div></div>';
  if (asset.metadata && asset.metadata.dimensions) {
    var dim = asset.metadata.dimensions;
    html += '<div class="field"><label class="field-label">Dimensions</label><div class="field-readonly">' + dim.width + ' x ' + dim.height + '</div></div>';
  }
  document.getElementById('panelContent').innerHTML = html;

  // Usage panel (lazy)
  document.getElementById('panelReferences').innerHTML = '<div class="empty-msg">Loading usage...</div>';
  var usage = await api('GET', '/assets/' + encodeURIComponent(id) + '/usage');
  if (Array.isArray(usage) && usage.length) {
    var uhtml = '<div class="field-label" style="margin-bottom:8px;">Used by ' + usage.length + ' document(s)</div>';
    for (var i = 0; i < usage.length; i++) {
      var u = usage[i];
      uhtml += '<div class="ref-item">'
        + '<span class="ref-dot in"></span>'
        + '<span class="ref-title">' + esc(u.title || u.name || u.heading || u._id) + '</span>'
        + '<span class="ref-type">' + esc(u._type) + '</span>'
        + '</div>';
    }
    document.getElementById('panelReferences').innerHTML = uhtml;
  } else {
    document.getElementById('panelReferences').innerHTML = '<div class="empty-msg">Not used by any documents</div>';
  }

  // Meta panel
  var mhtml = '';
  mhtml += '<div class="field"><label class="field-label">ID</label><div class="field-readonly">' + esc(asset._id) + '</div></div>';
  if (asset._createdAt) mhtml += '<div class="field"><label class="field-label">Uploaded</label><div class="field-readonly">' + esc(new Date(asset._createdAt).toLocaleString()) + '</div></div>';
  if (asset._updatedAt) mhtml += '<div class="field"><label class="field-label">Last Updated</label><div class="field-readonly">' + esc(new Date(asset._updatedAt).toLocaleString()) + '</div></div>';
  document.getElementById('panelMeta').innerHTML = mhtml;

  // Actions
  var actHtml = '';
  if (asset.url) actHtml += '<button class="btn sm" onclick="copyAssetUrl()">Copy URL</button>';
  actHtml += '<button class="btn sm" onclick="aiAssetAction()">AI Describe</button>';
  actHtml += '<span class="spacer"></span>';
  document.getElementById('detailActions').innerHTML = actHtml;

  switchTab('content');
}

function copyAssetUrl() {
  if (!state.selected || !state.selected.url) return;
  navigator.clipboard.writeText(state.selected.url).then(function() { showToast('URL copied', 'ok'); });
}

function aiAssetAction() {
  var a = state.selected;
  if (!a) return;
  Symphonee.askAi('Check this Sanity asset:\ncurl -s http://127.0.0.1:3800/api/plugins/sanity/assets/' + encodeURIComponent(a._id) + '/usage\n\nAsset: ' + (a.originalFilename || a._id) + '\nURL: ' + (a.url || 'N/A') + '\nMIME: ' + (a.mimeType || 'unknown') + '\n\nTell me: which documents use this asset? Is it orphaned? Suggest alt text if it is an image.');
}

// ============================================================================
var activeRteInstances = []; // track all mounted RTEs so we can collect their values on save

function mountRichEditor(mountEl, initialHtml, fieldKey) {
  mountEl.innerHTML = '';
  var wrap = document.createElement('div');
  wrap.className = 'rte-wrap';

  // Extra toolbar
  var extra = document.createElement('div');
  extra.className = 'rte-toolbar-extra';
  extra.innerHTML =
    '<button type="button" data-act="code" title="Toggle HTML source">'
    + '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>'
    + ' Code</button>'
    + '<button type="button" data-act="fullscreen" title="Fullscreen">'
    + '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>'
    + ' Fullscreen</button>';
  wrap.appendChild(extra);

  var editorEl = document.createElement('div');
  wrap.appendChild(editorEl);

  var codeEl = document.createElement('textarea');
  codeEl.className = 'rte-code-view';
  codeEl.spellcheck = false;
  wrap.appendChild(codeEl);
  mountEl.appendChild(wrap);

  var toolbarOptions = [
    [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
    ['bold', 'italic', 'underline', 'strike'],
    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
    [{ 'align': [] }],
    ['blockquote', 'code-block'],
    ['link', 'image'],
    ['clean']
  ];
  var quill = new Quill(editorEl, {
    theme: 'snow',
    modules: { toolbar: toolbarOptions },
    placeholder: 'Write content...',
  });
  try { quill.clipboard.dangerouslyPasteHTML(initialHtml || ''); } catch (_) {}

  // Code toggle
  extra.querySelector('[data-act="code"]').addEventListener('click', function(e) {
    e.preventDefault();
    var btn = e.currentTarget;
    if (wrap.classList.contains('code-view')) {
      try { quill.clipboard.dangerouslyPasteHTML(codeEl.value); } catch (_) {}
      wrap.classList.remove('code-view');
      btn.classList.remove('active');
    } else {
      codeEl.value = formatHtml(quill.root.innerHTML);
      wrap.classList.add('code-view');
      btn.classList.add('active');
      codeEl.focus();
    }
  });

  // Fullscreen toggle
  extra.querySelector('[data-act="fullscreen"]').addEventListener('click', function(e) {
    e.preventDefault();
    wrap.classList.toggle('fullscreen');
    e.currentTarget.classList.toggle('active');
  });

  var rte = {
    fieldKey: fieldKey,
    getHtml: function() {
      if (wrap.classList.contains('code-view')) return codeEl.value;
      return quill.root.innerHTML;
    },
    setHtml: function(html) {
      try { quill.clipboard.dangerouslyPasteHTML(html || ''); } catch (_) {}
      codeEl.value = formatHtml(html || '');
    },
    quill: quill,
    wrap: wrap,
  };
  activeRteInstances.push(rte);
  return rte;
}

function formatHtml(html) {
  // Simple HTML formatter for code view
  if (!html) return '';
  return html
    .replace(/></g, '>\n<')
    .replace(/\n{3,}/g, '\n\n');
}

var detailPreviewZoom = 1;

function getPreviewUrl() {
  return (state.health && state.health.previewUrl) || '';
}

function getDocSlug(doc) {
  if (!doc) return '';
  if (doc.slug && typeof doc.slug === 'object' && doc.slug.current) return '/' + doc.slug.current;
  if (doc.slug && typeof doc.slug === 'string') return '/' + doc.slug;
  return '';
}

function buildPageUrl(doc) {
  var base = getPreviewUrl();
  if (!base) return '';
  var slug = getDocSlug(doc);
  // Only build a preview URL if the document has a slug -- singletons like
  // header/footer have no page URL and shouldn't show a preview
  if (!slug) return '';
  return base + slug;
}

function setupDetailPreview(pageUrl) {
  requestAnimationFrame(function() {
    var vp = document.getElementById('previewViewport');
    var frame = document.getElementById('previewFrame');
    if (!vp || !frame) return;
    // Set 16:9 height before loading
    var w = vp.clientWidth;
    if (w > 0) vp.style.height = Math.round(w * 9 / 16) + 'px';
    vp.classList.add('loading');
    frame.onload = function() { vp.classList.remove('loading'); scaleDetailPreview(); };
    frame.onerror = function() { vp.classList.remove('loading'); };
    frame.src = pageUrl;
  });
}

function reloadDetailPreview() {
  var doc = state.selected;
  if (!doc) return;
  var pageUrl = buildPageUrl(doc);
  if (pageUrl) setupDetailPreview(pageUrl);
}

function scaleDetailPreview() {
  var vp = document.getElementById('previewViewport');
  var frame = document.getElementById('previewFrame');
  if (!vp) return;
  var w = vp.clientWidth;
  if (w > 0) vp.style.height = Math.round(w * 9 / 16) + 'px';
  applyPreviewScale(vp, frame, detailPreviewZoom);
  var label = document.getElementById('previewZoomLabel');
  if (label) label.textContent = Math.round(detailPreviewZoom * 100) + '%';
}

function adjustDetailZoom(delta) {
  detailPreviewZoom = Math.max(0.4, Math.min(3, Math.round((detailPreviewZoom + delta) * 100) / 100));
  scaleDetailPreview();
}

function applyPreviewScale(vp, frame, zoom) {
  if (!vp || !frame) return;
  var vpWidth = vp.clientWidth;
  var vpHeight = vp.clientHeight;
  if (vpWidth <= 0 || vpHeight <= 0) return;
  if (zoom === 1) {
    // At 1x, fill the container naturally -- no transform needed
    frame.style.width = '100%';
    frame.style.height = '100%';
    frame.style.transform = 'none';
  } else {
    // Simulate a different device width via scale transform
    var frameWidth = Math.max(280, Math.round(PREVIEW_BASE_WIDTH / zoom));
    var scale = vpWidth / frameWidth;
    var frameHeight = Math.ceil(vpHeight / scale);
    frame.style.width = frameWidth + 'px';
    frame.style.height = frameHeight + 'px';
    frame.style.transform = 'scale(' + scale + ')';
    frame.style.transformOrigin = '0 0';
  }
}

function setupHomePreview() {
  var base = getPreviewUrl();
  if (!base) return;
  var vp = document.getElementById('homePreviewViewport');

// JSON EDITOR (Monaco)
// ============================================================================
var monacoEditor = null, monacoReady = false, editorCtx = null;

function openJsonEditor() {
  var doc = state.selected;
  if (!doc) return;
  editorCtx = { docType: doc._type, docId: doc._id, doc: doc };

  document.getElementById('mainView').style.display = 'none';
  document.getElementById('editorView').classList.add('active');

  var title = doc.title || doc.name || doc.heading || doc._id;
  document.getElementById('editorTitle').textContent = title;
  document.getElementById('editorPath').textContent = doc._type + '/' + doc._id;
  document.getElementById('editorStatus').textContent = 'Loading...';

  var editDoc = Object.assign({}, doc);
  delete editDoc._rev;
  var content = JSON.stringify(editDoc, null, 2);

  ensureMonaco().then(function() {
    var container = document.getElementById('editorContainer');
    if (monacoEditor) { monacoEditor.dispose(); monacoEditor = null; }
    monacoEditor = monaco.editor.create(container, {
      value: content, language: 'json', theme: 'symphonee',
      fontSize: 13, fontFamily: "'Cascadia Code','Cascadia Mono',Consolas,'Courier New',monospace",
      minimap: { enabled: true }, scrollBeyondLastLine: false, wordWrap: 'off',
      automaticLayout: true, lineNumbers: 'on', renderWhitespace: 'selection',
      bracketPairColorization: { enabled: true }, smoothScrolling: true,
      cursorBlinking: 'smooth', padding: { top: 8 }, tabSize: 2, formatOnPaste: true,
    });
    monacoEditor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function() { saveEditor(); });
    document.getElementById('editorStatus').textContent = 'Ready';
  });
}

function closeEditor() {
  document.getElementById('editorView').classList.remove('active');
  document.getElementById('mainView').style.display = 'flex';
}

async function saveEditor() {
  if (!monacoEditor || !editorCtx) return;
  var raw = monacoEditor.getValue();
  var parsed;
  try { parsed = JSON.parse(raw); }
  catch (e) {
    document.getElementById('editorStatus').innerHTML = '<span class="err-text">Invalid JSON: ' + esc(e.message) + '</span>';
    return;
  }
  document.getElementById('editorStatus').textContent = 'Saving...';

  var patchData = {};
  for (var k in parsed) {
    if (k === '_id' || k === '_type' || k === '_createdAt' || k === '_updatedAt' || k === '_rev') continue;
    patchData[k] = parsed[k];
  }

  var r = await api('PATCH', '/documents/' + editorCtx.docType + '/' + editorCtx.docId, patchData);
  if (r.error) {
    document.getElementById('editorStatus').innerHTML = '<span class="err-text">Error: ' + esc(r.error) + '</span>';
  } else {
    document.getElementById('editorStatus').textContent = 'Saved';
    showToast('Document updated', 'ok');
    await loadSection();
  }
}

function ensureMonaco() {
  if (monacoReady) return Promise.resolve();
  return new Promise(function(resolve) {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js';
    s.onload = function() {
      require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs' } });
      require(['vs/editor/editor.main'], function() {
        monacoReady = true;
        var cs = getComputedStyle(document.documentElement);
        monaco.editor.defineTheme('symphonee', {
          base: 'vs-dark', inherit: true, rules: [],
          colors: {
            'editor.background': cs.getPropertyValue('--crust').trim(),
            'editor.lineHighlightBackground': cs.getPropertyValue('--surface0').trim(),
            'editorLineNumber.foreground': cs.getPropertyValue('--overlay0').trim(),
          }
        });
        resolve();
      });
    };
    document.head.appendChild(s);
  });
}

function askInput(opts) {
  return new Promise(function(resolve) {
    var root = document.getElementById('modalRoot');
    var isMulti = opts.multiline;
    var inputHtml = isMulti
      ? '<textarea class="field-input" id="modalInput" rows="4" placeholder="' + esc(opts.placeholder || '') + '">' + esc(opts.defaultValue || '') + '</textarea>'
      : '<input class="field-input" id="modalInput" type="text" value="' + esc(opts.defaultValue || '') + '" placeholder="' + esc(opts.placeholder || '') + '">';

    root.innerHTML = '<div class="modal-overlay" onclick="if(event.target===this)document.getElementById(\'modalRoot\').innerHTML=\'\'">'
      + '<div class="modal">'
      + '<div class="modal-header">' + esc(opts.title || 'Input') + '</div>'
      + '<div class="modal-body">'
      + '<label class="field-label">' + esc(opts.label || '') + '</label>'
      + inputHtml
      + '</div>'
      + '<div class="modal-actions">'
      + '<button class="btn" id="modalCancel">Cancel</button>'
      + '<button class="btn primary" id="modalOk">' + esc(opts.confirmText || 'OK') + '</button>'
      + '</div></div></div>';

    document.getElementById('modalInput').focus();
    document.getElementById('modalCancel').onclick = function() { root.innerHTML = ''; resolve(null); };
    document.getElementById('modalOk').onclick = function() { var v = document.getElementById('modalInput').value; root.innerHTML = ''; resolve(v); };
    if (!isMulti) {
      document.getElementById('modalInput').onkeydown = function(e) { if (e.key === 'Enter') { document.getElementById('modalOk').click(); } };
    }
  });
}

function askConfirm(opts) {
  return new Promise(function(resolve) {
    var root = document.getElementById('modalRoot');
    root.innerHTML = '<div class="modal-overlay">'
      + '<div class="modal">'
      + '<div class="modal-header">' + esc(opts.title || 'Confirm') + '</div>'
      + '<div class="modal-body"><p style="margin:0;font-size:13px;">' + esc(opts.message || '') + '</p></div>'
      + '<div class="modal-actions">'
      + '<button class="btn" id="modalCancel">Cancel</button>'
      + '<button class="btn ' + (opts.danger ? 'danger' : 'primary') + '" id="modalOk">' + esc(opts.confirmText || 'OK') + '</button>'
      + '</div></div></div>';
    document.getElementById('modalCancel').onclick = function() { root.innerHTML = ''; resolve(false); };
    document.getElementById('modalOk').onclick = function() { root.innerHTML = ''; resolve(true); };
  });
}

function askSelect(opts) {
  return new Promise(function(resolve) {
    var root = document.getElementById('modalRoot');
    var optHtml = (opts.options || []).map(function(o) {
      return '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>';
    }).join('');

    root.innerHTML = '<div class="modal-overlay" onclick="if(event.target===this)document.getElementById(\'modalRoot\').innerHTML=\'\'">'
      + '<div class="modal">'
      + '<div class="modal-header">' + esc(opts.title || 'Select') + '</div>'
      + '<div class="modal-body">'
      + '<label class="field-label">' + esc(opts.label || '') + '</label>'
      + '<select class="field-input" id="modalSelect">' + optHtml + '</select>'
      + '</div>'
      + '<div class="modal-actions">'
      + '<button class="btn" id="modalCancel">Cancel</button>'
      + '<button class="btn primary" id="modalOk">OK</button>'
      + '</div></div></div>';
    document.getElementById('modalCancel').onclick = function() { root.innerHTML = ''; resolve(null); };
    document.getElementById('modalOk').onclick = function() { var v = document.getElementById('modalSelect').value; root.innerHTML = ''; resolve(v); };
  });
}

// ============================================================================

// ============================================================================
function showToast(msg, level) {
  var existing = document.querySelector('.toast');
  if (existing) existing.remove();
  var el = document.createElement('div');
  el.className = 'toast' + (level ? ' ' + level : '');
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 3000);
}

// ============================================================================
// HELPERS
// ============================================================================
async function api(m, p, b) {
  try {
    var o = { method: m, headers: { 'Content-Type': 'application/json' } };
    if (b) o.body = JSON.stringify(b);
    var r = await fetch(API + p, o);
    return await r.json();
  } catch (e) { return { error: e.message }; }
}

function esc(s) { var d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }

function displayName(n) {
  return (n || '').split(/[-_]/).map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
}

function timeAgo(ts) {
  if (!ts) return '';
  var d = Date.now() - new Date(ts).getTime(), m = Math.floor(d / 60000);
  if (m < 1) return 'now';
  if (m < 60) return m + 'm ago';
  var h = Math.floor(m / 60);
  if (h < 24) return h + 'h ago';
  var dy = Math.floor(h / 24);
  if (dy < 30) return dy + 'd ago';
  return new Date(ts).toLocaleDateString();
}

function formatBytes(bytes) {
  if (!bytes) return '0 B';
  var k = 1024, sizes = ['B', 'KB', 'MB', 'GB'];
  var i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function skeletonHtml(n) {
  var html = '<div class="skeleton">';
  for (var i = 0; i < n; i++) html += '<div class="skeleton-row"></div>';
  return html + '</div>';
}

// ============================================================================
// EVENT LISTENERS
// ============================================================================
Symphonee.on('tabActivated', function(d) {
  if (d.tab && d.tab.indexOf('sanity') !== -1) refresh();
});

window.addEventListener('resize', function() {
  if (state.section && state.section.kind === 'home') scaleHomePreview();
  if (state.selected) scaleDetailPreview();
});

window.addEventListener('message', function(e) {
  if (!e.data || !e.data.__symphonee) return;
  if (e.data.type === 'configChanged' && e.data.plugin === 'sanity') {
    loadProjectSelector().then(function() { init(); });
  }
  if (e.data.type === 'openType' && e.data.docType) {
    var typeName = e.data.docType;
    var t = state.docTypes.find(function(x) { return x.name === typeName; });
    selectSection({ kind: 'type', slug: 'type:' + typeName, typeName: typeName, label: displayName(typeName), count: t ? t.count : 0 });
  }
});

// ============================================================================
init();
